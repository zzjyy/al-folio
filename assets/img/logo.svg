<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ZZOK College seal">
  <defs>
    <path id="circ-top" d="M 256,256 m -210,0 a 210,210 0 1,1 420,0" fill="none"/>
    <path id="circ-bot" d="M 256,256 m -210,0 a 210,210 0 1,0 420,0" fill="none"/>
    <style>
      .navy { fill: #14315c; }
      .gold { fill: #c9a64e; }
      .ink  { fill: #14315c; }
      .ring-text {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-size: 26px;
        letter-spacing: 6px;
        font-weight: 600;
        fill: #14315c;
      }
      .mark {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-weight: 700;
        fill: #14315c;
      }
      .sub {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-size: 22px;
        letter-spacing: 4px;
        fill: #14315c;
        font-style: italic;
      }
      .est {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-size: 20px;
        letter-spacing: 3px;
        fill: #c9a64e;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Outer rings -->
  <circle cx="256" cy="256" r="244" fill="#fafaf6"/>
  <circle cx="256" cy="256" r="234" fill="none" stroke="#14315c" stroke-width="3"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#14315c" stroke-width="1"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#c9a64e" stroke-width="1.5"/>

  <!-- Curved seal text -->
  <text class="ring-text">
    <textPath href="#circ-top" startOffset="50%" text-anchor="middle">
      • COLLEGIUM INFORMATICAE ET COGNITIONIS •
    </textPath>
  </text>
  <text class="ring-text">
    <textPath href="#circ-bot" startOffset="50%" text-anchor="middle">
      • SZCZECIN • POLONIA • MMVI •
    </textPath>
  </text>

  <!-- Top ornament: open book (knowledge) -->
  <g transform="translate(256 132)">
    <!-- pages -->
    <path d="M -42,-2 L -2,-12 L -2,18 L -42,28 Z" class="navy"/>
    <path d="M  42,-2 L  2,-12 L  2,18 L  42,28 Z" class="navy"/>
    <!-- spine highlight -->
    <line x1="0" y1="-10" x2="0" y2="20" stroke="#c9a64e" stroke-width="2"/>
  </g>

  <!-- Central monogram: ZZOK -->
  <text x="256" y="260" text-anchor="middle" class="mark" font-size="92">ZZOK</text>

  <!-- Subline -->
  <text x="256" y="306" text-anchor="middle" class="sub">Collegium</text>

  <!-- Bottom ornament: laurel sprig (left + right) -->
  <g class="gold" transform="translate(256 354)">
    <!-- left laurel -->
    <g transform="translate(-44 0)">
      <path d="M 0,0 Q -30,-6 -42,-22" stroke="#c9a64e" stroke-width="2" fill="none"/>
      <ellipse cx="-10" cy="-4" rx="6" ry="3" transform="rotate(-20 -10 -4)"/>
      <ellipse cx="-22" cy="-10" rx="6" ry="3" transform="rotate(-30 -22 -10)"/>
      <ellipse cx="-34" cy="-18" rx="6" ry="3" transform="rotate(-40 -34 -18)"/>
      <ellipse cx="-16" cy="6"  rx="6" ry="3" transform="rotate(20 -16 6)"/>
      <ellipse cx="-28" cy="2"  rx="6" ry="3" transform="rotate(10 -28 2)"/>
    </g>
    <!-- right laurel (mirror) -->
    <g transform="translate(44 0) scale(-1 1)">
      <path d="M 0,0 Q -30,-6 -42,-22" stroke="#c9a64e" stroke-width="2" fill="none"/>
      <ellipse cx="-10" cy="-4" rx="6" ry="3" transform="rotate(-20 -10 -4)"/>
      <ellipse cx="-22" cy="-10" rx="6" ry="3" transform="rotate(-30 -22 -10)"/>
      <ellipse cx="-34" cy="-18" rx="6" ry="3" transform="rotate(-40 -34 -18)"/>
      <ellipse cx="-16" cy="6"  rx="6" ry="3" transform="rotate(20 -16 6)"/>
      <ellipse cx="-28" cy="2"  rx="6" ry="3" transform="rotate(10 -28 2)"/>
    </g>
    <!-- est date in middle -->
    <text x="0" y="6" text-anchor="middle" class="est">EST · 2006</text>
  </g>
</svg>
